<nav
  class="bg-black bg-opacity-80 text-white fixed top-0 left-0 w-full z-50 shadow-lg"
>
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      <div class="flex-shrink-0 text-2xl font-bold text-yellow-400">
        Coach Maurice
      </div>

      <div class="hidden md:flex space-x-6" *ngFor="let item of quickLinks">
        <a href="#{{ item.value }}" class="hover:text-yellow-400 transition"
          >{{ item.name }}
        </a>
      </div>

      <!-- Mobile menu button -->
      <div class="md:hidden">
        <button (click)="toggleMenu()" class="focus:outline-none">
          <svg
            *ngIf="!menuOpen"
            class="h-6 w-6"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"
            />
          </svg>
          <svg
            *ngIf="menuOpen"
            class="h-6 w-6"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile Menu -->
  <div
    *ngIf="menuOpen"
    class="md:hidden px-4 pb-4 bg-black bg-opacity-90 text-white space-y-3"
  >
    <div *ngFor="let item of quickLinks">
      <a href="#{{ item.value }}" class="hover:text-yellow-400 transition"
        >{{ item.name }}
      </a>
    </div>
  </div>
</nav>
