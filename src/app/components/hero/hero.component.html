<section
  class="relative min-h-screen flex items-center justify-center overflow-hidden bg-black"
>
  <!-- Background -->
  <div class="absolute inset-0 z-0 bg-black"></div>

  <div class="relative z-10 text-center px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto">
    <!-- Main Content Container -->
    <div class="space-y-12">
      <!-- Video Container -->
      <div class="relative max-w-4xl mx-auto">
        <div
          class="relative rounded-2xl overflow-hidden shadow-2xl bg-gray-900"
        >
          <app-video-intro
            (videoLoaded)="onVideoLoaded()"
            (videoEnded)="onVideoEnded()"
            class="w-full aspect-video"
          ></app-video-intro>
        </div>
      </div>

      <!-- Minimal Text Content -->
      <div class="space-y-8">
        <h1
          class="text-4xl sm:text-5xl md:text-6xl font-bold text-[#FFD700] tracking-tight"
        >
          Transform Your Body.
        </h1>

        <p class="text-xl text-gray-300 max-w-2xl mx-auto">
          Science-backed coaching for serious results.
        </p>

        <!-- Single CTA -->
        <div class="pt-4">
          <a href="#contact">
            <button
              class="px-8 py-4 bg-[#FFD700] text-black font-semibold rounded-lg hover:bg-gray-100 transition-colors duration-200 text-lg"
            >
              Get Started
            </button>
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- Scroll Indicator -->
  <a
    href="#about"
    class="absolute bottom-8 left-1/2 transform -translate-x-1/2 animate-bounce cursor-pointer"
  >
    <svg
      class="w-6 h-6 text-white"
      fill="none"
      stroke="currentColor"
      viewBox="0 0 24 24"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M19 14l-7 7m0 0l-7-7m7 7V3"
      ></path>
    </svg>
  </a>
</section>
